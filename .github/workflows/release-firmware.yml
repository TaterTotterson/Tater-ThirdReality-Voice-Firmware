name: Release S420 Firmware

on:
  push:
    tags:
      - "s420-*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TATER_SWUPDATE_PRIVATE_KEY_PEM: ${{ secrets.TATER_SWUPDATE_PRIVATE_KEY_PEM }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Validate release inputs
        run: |
          set -euo pipefail
          test -n "$TATER_SWUPDATE_PRIVATE_KEY_PEM"
          VERSION="${GITHUB_REF_NAME#s420-}"
          test "$GITHUB_REF_NAME" = "s420-${VERSION}"
          grep -q "^TATER_S420_FIRMWARE_VERSION = ${VERSION}$" buildroot/package/thirdreality/tater-s420-firmware/tater-s420-firmware.mk
          python3 script/validate_firmware.py
          python3 -m unittest discover -s tests -v

      - name: Build image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#s420-}"
          docker build --platform linux/amd64 -t tater-s420-builder .
          docker run --rm \
            --platform linux/amd64 \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/build" \
            -e "HOME=/build" \
            -e "TATER_SWUPDATE_PRIVATE_KEY_PEM" \
            tater-s420-builder trspk "$VERSION"

      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#s420-}"
          RELEASE_DIR="${RUNNER_TEMP}/tater-s420-release"
          python3 script/build_release_manifest.py \
            --version "$VERSION" \
            --release-dir "$RELEASE_DIR" \
            --release-repo "$GITHUB_REPOSITORY" \
            --release-tag "$GITHUB_REF_NAME"
          RELEASE_MANIFEST="$(ls "$RELEASE_DIR"/*-manifest.json | head -n 1)"
          python3 script/render_release_notes.py \
            "$RELEASE_MANIFEST" \
            "$RELEASE_DIR/RELEASE_NOTES.md"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tater-s420-${{ env.VERSION }}
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_DIR"/* --clobber
            gh release edit "$GITHUB_REF_NAME" --latest --title "Tater S420 ${VERSION}" --notes-file "$RELEASE_DIR/RELEASE_NOTES.md"
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_DIR"/* --latest --verify-tag --title "Tater S420 ${VERSION}" --notes-file "$RELEASE_DIR/RELEASE_NOTES.md"
          fi
