driftfile /var/lib/ntp/ntp.drift

# Security: deny external queries/modifications, allow loopback.
restrict default nomodify nopeer noquery limited kod
restrict 127.0.0.1
restrict ::1

# Tater public fallback: US-based NIST Internet Time Service. DHCP Option 42
# servers are prepended at runtime by ntp-from-dhcp.
server time-a-g.nist.gov
server time-a-b.nist.gov
server time-a-wwv.nist.gov
